name: Build NetHunter Target Modules
description: Build stock Wi-Fi baseline and VHCI module from active kernel workspace
inputs:
  target:
    description: Exact target name from the device matrix
    required: true
  kernel_src:
    description: Root directory populated by kernel-source-sync, including manifest.xml
    required: true
  common_out:
    description: Full common kernel output directory used by Image modules build
    required: true
  output_dir:
    description: Directory for module and build-evidence outputs
    required: true
outputs:
  output_dir:
    description: Directory containing baseline module artifacts and evidence
    value: ${{ inputs.output_dir }}
  using: composite
  steps:
    - name: Validate source and build stock target modules
      shell: bash
      env:
        NH_TARGET: ${{ inputs.target }}
        NH_KERNEL_SRC: ${{ inputs.kernel_src }}
        NH_COMMON_OUT: ${{ inputs.common_out }}
        NH_OUTPUT_DIR: ${{ inputs.output_dir }}
      run: |
        set -euo pipefail
        bash scripts/nethunter/build_target_modules.sh \
          "$NH_TARGET" "$NH_KERNEL_SRC" "$NH_COMMON_OUT" "$NH_OUTPUT_DIR"
