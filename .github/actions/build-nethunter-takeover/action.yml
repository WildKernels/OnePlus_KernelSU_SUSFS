name: Build NetHunter Takeover Components
inputs:
  target:
    required: true
  version:
    required: true
outputs:
  zip_path:
    value: ${{ steps.pack.outputs.zip_path }}
runs:
  using: composite
  steps:
    - name: Build hci_vhci module
      shell: bash
      run: bash scripts/nethunter/build_btvhci.sh ${{ inputs.target }}

    - name: Build bluebinder
      shell: bash
      run: bash scripts/nethunter/build_bluebinder.sh

    - name: Build nci_raw_tool for aarch64 Android
      shell: bash
      run: bash scripts/nethunter/build_nci_raw_tool.sh

    - name: Pack takeover ZIP
      id: pack
      shell: bash
      run: |
        bash scripts/nethunter/pack_takeover_zip.sh ${{ inputs.target }} ${{ inputs.version }}
        echo "zip_path=dist/nethunter-takeover-${{ inputs.target }}-${{ inputs.version }}.zip" >> $GITHUB_OUTPUT

    - name: Generate provenance entry
      shell: bash
      run: |
        ko_hash=$(sha256sum /tmp/nh-build/${{ inputs.target }}/hci_vhci.ko 2>/dev/null | cut -d' ' -f1 || echo not_built)
        bb_hash=$(sha256sum /tmp/nh-build/bluebinder/bluebinder 2>/dev/null | cut -d' ' -f1 || echo not_built)
        nci_hash=$(sha256sum nethunter/nfc/nci_raw_tool 2>/dev/null | cut -d' ' -f1 || echo not_built)
        jq -n \
          --arg target "${{ inputs.target }}" \
          --arg version "${{ inputs.version }}" \
          --arg bt_vhci_commit "$(cat scripts/nethunter/btvhci_source_commit 2>/dev/null || echo pinned-kernel)" \
          --arg bluebinder_commit "c3e1b155e308f6df9c9a02dbd909a44e7319ab7d" \
          --arg zip_sha256 "$(sha256sum dist/nethunter-takeover-${{ inputs.target }}-${{ inputs.version }}.zip | cut -d' ' -f1)" \
          --arg hci_vhci_sha256 "$ko_hash" \
          --arg bluebinder_sha256 "$bb_hash" \
          --arg nci_raw_tool_sha256 "$nci_hash" \
          '{
            target: $target,
            version: $version,
            wifi_injection: "not_ported_yet",
            wifi_patch_commits: [],
            components: {
              hci_vhci: {commit: $bt_vhci_commit, sha256: $hci_vhci_sha256},
              bluebinder: {commit: $bluebinder_commit, sha256: $bluebinder_sha256},
              nci_raw_tool: {sha256: $nci_raw_tool_sha256}
            },
            zip_sha256: $zip_sha256
          }' > dist/provenance-${{ inputs.target }}.json
