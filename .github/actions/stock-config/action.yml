name: 'Spoof /proc/config.gz with the stock config'
description: >-
  Installs kernel_configs/<aNN>/<MODEL>_stock_defconfig (the stock kernel config pulled
  from the device's own boot.img / /proc/config.gz) into the kernel tree as
  arch/arm64/configs/stock_defconfig and repoints the IKCONFIG rule at it:

    $(obj)/config_data: $(KCONFIG_CONFIG) FORCE
      ->  $(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE

  Result: the built kernel embeds the OEM config blob, so /proc/config.gz on the phone
  reports the stock config instead of the Wild build config (no CONFIG_KSU / SUSFS /
  BBR / BBG lines visible to detectors).

  Best-effort: a missing defconfig or an unexpected Makefile rule only emits a warning
  annotation and the build continues with the real build config.

inputs:
  kernel_dir:
    description: 'Path to the kernel common tree (the dir that has arch/ and kernel/)'
    required: true
  model:
    description: 'Device model from the matrix, e.g. OP13 or OP13-6.6.89'
    required: true
  os_version:
    description: 'Android release from the matrix, e.g. A16'
    required: true
  repo_root:
    description: 'Repo root holding kernel_configs/ (default: auto-detect)'
    required: false
    default: ''
  fail_on_missing:
    description: 'Fail the job instead of warning when no stock config is found'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install stock defconfig and patch kernel/Makefile
      shell: bash
      env:
        KERNEL_DIR: ${{ inputs.kernel_dir }}
        MODEL: ${{ inputs.model }}
        OS_VERSION: ${{ inputs.os_version }}
        REPO_ROOT: ${{ inputs.repo_root }}
        FAIL_ON_MISSING: ${{ inputs.fail_on_missing }}
      run: |
        set -uo pipefail

        warn() { echo "::warning title=stock-config::$1"; echo "[!] stock-config: $1 — /proc/config.gz keeps the real build config"; }
        die()  { if [ "${FAIL_ON_MISSING}" = "true" ]; then echo "::error title=stock-config::$1"; exit 1; fi; warn "$1"; exit 0; }

        # ---- locate the repo checkout that holds kernel_configs/
        roots=()
        [ -n "${REPO_ROOT}" ] && roots+=("${REPO_ROOT}")
        roots+=("${GITHUB_WORKSPACE}/action-source" "${GITHUB_WORKSPACE}")
        ROOT=""
        for r in "${roots[@]}"; do
          if [ -d "${r}/kernel_configs" ]; then ROOT="$r"; break; fi
        done
        [ -n "$ROOT" ] || die "no kernel_configs/ directory found (looked in: ${roots[*]})"

        # ---- resolve the folder (A16 -> a16) and the model file
        FOLDER="a${OS_VERSION#A}"
        BASE="${MODEL%%-[0-9]*}"      # OP13-6.6.89 -> OP13;  OP-ACE-5-ULTRA stays as-is
        CFG=""
        for cand in "${MODEL}" "${BASE}"; do
          f="${ROOT}/kernel_configs/${FOLDER}/${cand}_stock_defconfig"
          if [ -f "$f" ]; then CFG="$f"; break; fi
        done
        if [ -z "$CFG" ]; then
          echo "::group::stock-config lookup"
          echo "looked for: kernel_configs/${FOLDER}/${MODEL}_stock_defconfig"
          echo "            kernel_configs/${FOLDER}/${BASE}_stock_defconfig"
          ls -1 "${ROOT}/kernel_configs/${FOLDER}" 2>/dev/null | head -40 || true
          echo "::endgroup::"
          die "no stock config for ${MODEL} (${OS_VERSION})"
        fi

        # ---- install it as arch/arm64/configs/stock_defconfig
        DEST="${KERNEL_DIR}/arch/arm64/configs/stock_defconfig"
        mkdir -p "$(dirname "$DEST")" || die "kernel tree missing at ${KERNEL_DIR}"
        cp "$CFG" "$DEST" || die "could not copy ${CFG} to ${DEST}"
        SYMS=$(grep -cE '^(CONFIG_|# CONFIG_)' "$DEST" || true)
        echo "[+] stock config: ${CFG#${ROOT}/} -> ${DEST} (${SYMS} symbols)"
        [ "${SYMS:-0}" -gt 1000 ] || die "installed config looks truncated (${SYMS} symbols)"

        # ---- repoint the embedded-config rule
        MK="${KERNEL_DIR}/kernel/Makefile"
        [ -f "$MK" ] || die "${MK} not found"
        if grep -qF '$(obj)/config_data: $(KCONFIG_CONFIG) FORCE' "$MK"; then
          sed -i 's|\$(obj)/config_data: \$(KCONFIG_CONFIG) FORCE|$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE|' "$MK"
        fi
        if grep -qF 'config_data: arch/arm64/configs/stock_defconfig FORCE' "$MK"; then
          echo "[+] patched ${MK}:"
          grep -nF 'config_data:' "$MK" | sed 's/^/    /'
          echo "[+] /proc/config.gz will report the stock config"
        else
          echo "::group::kernel/Makefile config_data rule"
          grep -nF 'config_data' "$MK" | sed 's/^/    /' || echo "    (no config_data rule at all)"
          echo "::endgroup::"
          die "kernel/Makefile has no '\$(obj)/config_data: \$(KCONFIG_CONFIG) FORCE' rule to repoint"
        fi

        # ---- sanity: a stock config must not carry root markers
        BAD=$(grep -cE '^CONFIG_(KSU|KSU_SUSFS|SCHED_BORE)' "$DEST" || true)
        if [ "${BAD:-0}" != "0" ]; then
          echo "::warning title=stock-config::stock config carries ${BAD} KSU/SUSFS/BORE line(s) — verify its source"
        fi
